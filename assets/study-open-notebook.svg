<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <linearGradient id="paper-book" gradientUnits="userSpaceOnUse" x1="60" y1="60" x2="1140" y2="740">
      <stop offset="0" stop-color="#0d1720"/>
      <stop offset=".55" stop-color="#091116"/>
      <stop offset="1" stop-color="#070b10"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#005bb5"/>
    </linearGradient>
  </defs>

  <!-- espessura / páginas empilhadas -->
  <g transform="translate(0 10)" opacity=".4">
    <rect x="60" y="60" width="1080" height="680" rx="24" fill="none" stroke="#ffffff12" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- páginas conectadas no centro -->

  <!-- contorno único do livro -->
  <rect x="60" y="60" width="1080" height="680" rx="24" fill="url(#paper-book)" fill-opacity=".8" stroke-opacity=".55" vector-effect="non-scaling-stroke"/>

  <!-- brilho azul nas bordas externas -->
  <path d="M60 84v632M1140 84v632M84 60H1116" stroke="#7acaff" stroke-opacity=".28" stroke-width="1.5" vector-effect="non-scaling-stroke"/>


  <!-- cabeçalho com marcador -->
  <circle cx="108" cy="160" r="3" fill="#7acaff" stroke="none" opacity=".55"/>
  <circle cx="1092" cy="160" r="3" fill="#7acaff" stroke="none" opacity=".55"/>
  <path d="M124 160H556M644 160H1076" stroke-opacity=".12" vector-effect="non-scaling-stroke"/>

  <!-- pautado -->
  <path d="M108 220H556M108 290H556M108 360H556M108 430H556M108 500H556M108 570H556M108 640H556M108 700H556" stroke-opacity=".075" vector-effect="non-scaling-stroke"/>
  <path d="M644 220H1092M644 290H1092M644 360H1092M644 430H1092M644 500H1092M644 570H1092M644 640H1092M644 700H1092" stroke-opacity=".075" vector-effect="non-scaling-stroke"/>

  <!-- margem azul -->
  <path d="M164 140v560M1036 140v560" stroke="#7acaff" stroke-opacity=".26" stroke-width="1.5" vector-effect="non-scaling-stroke"/>

  <!-- marcador de página -->
  <path d="M1084 60h28v148l-14-11-14 11z" fill="url(#ribbon)" fill-opacity=".7" stroke="#7acaff" stroke-opacity=".32" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
</svg>
